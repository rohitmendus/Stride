<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#244c3c" />
    <title>Stride · Project board</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet" href="assets/preview.css" />
    <script src="assets/board.js" defer></script>
  </head>
  <body class="preview-board">
    <button
      class="mobile-scrim"
      id="scrim"
      aria-label="Close navigation"
      hidden
    ></button>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a href="./" class="brand"
        ><span class="brand-mark" aria-hidden="true">s</span>stride<span
          class="brand-dot"
          >.</span
        ></a
      >
      <div class="nav-label">DEMO WORKSPACE</div>
      <nav>
        <button class="nav-item active" id="all-tasks" aria-pressed="true">
          <span class="icon" data-icon="projects"></span>All tasks
        </button>
        <button class="nav-item" id="my-tasks" aria-pressed="false">
          <span class="icon" data-icon="check"></span>My tasks<span
            class="nav-count"
            id="my-count"
          ></span>
        </button>
      </nav>
      <div class="nav-label projects-label">DEMO BOARD</div>
      <button class="project-link" id="project-link">
        <span class="project-dot"></span>Stride launch
      </button>
      <div class="sidebar-bottom">
        <button id="reset-demo" class="nav-item">
          <span class="icon" data-icon="reset"></span>Reset demo
        </button>
        <div class="profile">
          <span class="avatar avatar-green">AL</span>
          <div><strong>Alex Lee</strong><span>Demo identity · My tasks</span></div>
          <span class="demo-pill">DEMO</span>
        </div>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="icon-button mobile-menu"
            id="menu-toggle"
            aria-label="Open navigation"
            aria-expanded="false"
          >
            <span class="icon" data-icon="menu"></span></button
          ><span>Workspace / Demo board</span>
        </div>
        <span class="prototype-label">Browser-local demo</span>
      </header>
      <section class="project-header">
        <div class="project-heading">
          <h1>Stride launch<span class="heading-dot" aria-hidden="true">.</span></h1>
        </div>
        <p class="project-description">
          A little less noise. A clear next step.
        </p>
      </section>
      <section class="work-area" aria-label="Project tasks">
        <div class="view-bar">
          <div class="view-tabs" role="group" aria-label="Task view">
            <button
              class="view-tab selected"
              data-view="board"
              aria-pressed="true"
            >
              <span class="icon" data-icon="board"></span>Board</button
            ><button class="view-tab" data-view="list" aria-pressed="false">
              <span class="icon" data-icon="list"></span>List
            </button>
          </div>
          <span class="task-total" id="task-total"></span>
        </div>
        <div class="toolbar">
          <div class="tools-left">
            <label class="search-box"
              ><span class="icon" data-icon="search"></span
              ><input
                id="search"
                type="search"
                placeholder="Search tasks…"
                aria-label="Search tasks"
              /><span class="search-hint">/</span></label
            ><button
              class="button button-white"
              id="filter-toggle"
              aria-expanded="false"
              aria-controls="filters"
            >
              <span class="icon" data-icon="filter"></span>Filter<span
                id="filter-indicator"
                hidden
              ></span>
            </button>
          </div>
          <button class="button button-primary" id="new-task">
            <span class="icon" data-icon="plus"></span>New task
          </button>
        </div>
        <div id="filters" class="filter-row" hidden>
          <label
            >Priority<select id="priority-filter">
              <option value="">All priorities</option>
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
              <option>Critical</option>
            </select></label
          ><label
            >Assignee<select id="assignee-filter">
              <option value="">Everyone</option>
              <option value="Alex Lee">Alex Lee</option>
              <option value="Jamie Kim">Jamie Kim</option>
              <option value="Morgan Shah">Morgan Shah</option>
              <option value="Unassigned">Unassigned</option>
            </select></label
          ><button class="text-button" id="clear-filters">Clear filters</button>
        </div>
        <div class="board" id="board" aria-label="Kanban board"></div>
        <div class="list-view" id="list-view" hidden></div>
        <footer class="board-footer">
          <span
            ><span class="icon" data-icon="move"></span>Drag to move. Open a
            task to edit its details or status.</span
          ><span id="save-status" aria-live="polite">Demo tasks · saved only in this browser</span>
        </footer>
      </section>
    </main>
    <dialog id="task-dialog" aria-labelledby="dialog-title">
      <form id="task-form">
        <div class="dialog-top">
          <span class="eyebrow">STRIDE LAUNCH</span
          ><button
            type="button"
            class="icon-button"
            id="close-dialog"
            aria-label="Close task"
          >
            <span class="icon" data-icon="close"></span>
          </button>
        </div>
        <h2 id="dialog-title">New task</h2>
        <input type="hidden" id="task-id" /><label class="field"
          >Title<input
            id="task-title"
            required
            maxlength="160"
            placeholder="What needs to get done?" /></label
        ><label class="field"
          >Description<textarea
            id="task-description"
            rows="4"
            maxlength="3000"
            placeholder="Add a little context…"
          ></textarea>
        </label>
        <div class="form-grid">
          <label class="field"
            >Status<select id="task-status">
              <option>To Do</option>
              <option>In Progress</option>
              <option>Review</option>
              <option>Completed</option>
            </select></label
          ><label class="field"
            >Priority<select id="task-priority">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
              <option>Critical</option>
            </select></label
          ><label class="field"
            >Assignee<select id="task-assignee">
              <option>Unassigned</option>
              <option>Alex Lee</option>
              <option>Jamie Kim</option>
              <option>Morgan Shah</option>
            </select></label
          ><label class="field"
            >Deadline<input id="task-deadline" type="date" required
          /></label>
        </div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button type="button" class="text-button danger" id="delete-task">
            Delete task
          </button>
          <div class="dialog-save-actions">
            <button
              type="button"
              class="button button-white"
              id="cancel-dialog"
            >
              Cancel</button
            ><button class="button button-primary" type="submit">
              Save task
            </button>
          </div>
        </div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
