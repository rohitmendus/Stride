<a class="dashboard-task" href="{% url 'tasks:detail' task.project_id task.pk %}">
  <span class="dashboard-task-copy"><strong>{{ task.title }}</strong><small>{{ task.project.title }} · {% if task.assigned_to %}{{ task.assigned_to.get_full_name|default:task.assigned_to.email }}{% else %}Unassigned{% endif %}</small></span>
  <span class="dashboard-task-meta"><span class="task-priority priority-{{ task.priority }}">{{ task.get_priority_display }}</span><time{% if overdue %} class="overdue"{% endif %} datetime="{{ task.deadline|date:'Y-m-d' }}">{{ task.deadline|date:"M j" }}</time></span>
</a>
