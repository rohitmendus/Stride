<a class="list-row" data-task-id="{{ task.pk }}" href="{% url 'tasks:detail' task.project_id task.pk %}?{{ board_query }}" hx-get="{% url 'tasks:detail' task.project_id task.pk %}?{{ board_query }}" hx-target="#task-dialog-content" hx-swap="innerHTML" hx-push-url="false" aria-haspopup="dialog" aria-controls="task-dialog"><span class="list-title">{{ task.title }}<small>{% if personal_workspace %}{{ task.project.title }} · {% endif %}STR-{{ task.pk|stringformat:"03d" }} · {{ task.assignee_label }}</small></span><span class="list-status">{{ task.get_status_display }}</span><span class="task-priority priority priority-{{ task.priority }}">{{ task.get_priority_display }}</span><span class="list-date{% if task.is_overdue %} overdue{% endif %}"><time datetime="{{ task.deadline|date:'Y-m-d' }}">{{ task.deadline|date:"M j" }}</time>{% if task.is_overdue %}<span class="task-live-status"> · Overdue</span>{% endif %}</span></a>
